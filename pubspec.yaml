name: deprem_takip
description: "Türkiye ve çevresindeki son depremleri AFAD ve Kandilli verileriyle gösteren mobil uygulama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # NOT: Surum alt sinirlari bilerek genis tutuldu. Boylece pub, senin
  # Flutter surumunle uyumlu en uygun surumu kendisi secebilir.

  # HTTP istekleri (API'den veri cekmek icin)
  http: ^1.2.0

  # Harita - OpenStreetMap kullanir, API anahtari GEREKTIRMEZ
  flutter_map: ^8.0.0

  # Enlem/boylam veri tipi (flutter_map ile birlikte kullanilir)
  latlong2: ^0.9.1

  # Kullanici tercihlerini telefonda saklamak icin
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
