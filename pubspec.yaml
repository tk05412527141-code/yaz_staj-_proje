name: deprem_takip
description: "Türkiye ve çevresindeki son depremleri AFAD ve Kandilli verileriyle gösteren mobil uygulama."
publish_to: 'none'
# 1.1.0 — Liquid Glass (iOS 26) arayuz yenilemesi.
# App Store'daki yayindaki surum 1.0 (build 1); guncelleme icin hem
# surum hem build numarasi buyumek zorunda.
#
# Build 3: iOS dagitim hedefi 13.0 -> 15.0'a cikarildi, arsiv yeniden
# uretildi. (Bir build numarasi App Store Connect'e bir kez yuklenir;
# yeniden kullanilamaz, o yuzden her arsivde artiyor.)
version: 1.1.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # NOT: Surum alt sinirlari bilerek genis tutuldu. Boylece pub, senin
  # Flutter surumunle uyumlu en uygun surumu kendisi secebilir.

  # HTTP istekleri (API'den veri cekmek icin)
  http: ^1.2.0

  # Harita - OpenStreetMap kullanir, API anahtari GEREKTIRMEZ
  flutter_map: ^8.0.0

  # Enlem/boylam veri tipi (flutter_map ile birlikte kullanilir)
  latlong2: ^0.9.1

  # Kullanici tercihlerini telefonda saklamak icin
  shared_preferences: ^2.3.0

  # Yerel bildirimler (hazirlik hatirlatmalari)
  # SURUM SABIT: 20.x tum parametreleri adlandirilmisa cevirdi ve
  # Flutter 3.32+, 21.x ise Flutter 3.38+ istiyor. 19.x API'si sabit
  # ve Flutter 3.22+ ile calisiyor.
  flutter_local_notifications: ^19.0.0

  # Zamanlanmis bildirimler icin saat dilimi veritabani
  timezone: ^0.10.0

  # Acil durumda GPS konumu almak icin.
  # Surum araligi genis: kullandigimiz API (locationSettings) 13.x ve
  # 14.x'te ayni, boylece pub uygun surumu kendisi secebilir.
  geolocator: '>=13.0.0 <15.0.0'

  # SMS / WhatsApp / telefon uygulamalarini acmak icin
  url_launcher: ^6.3.0

  # RSS (XML) ayristirma - haber beslemeleri icin.
  # Genis aralik: kullandigimiz API (XmlDocument.parse, findAllElements,
  # innerText) 6.3+ ve 7.x'te ayni.
  xml: '>=6.3.0 <8.0.0'

  # iOS 26 "Liquid Glass" tasarim katmani.
  #
  # Shader tabanli: gercek bulaniklik, kirilma ve jelly animasyonlari
  # her platformda (iOS, Android, web, masaustu) calisiyor. Uygulamanin
  # mantigi bu paketten bagimsiz; yalnizca gorunum katmani.
  liquid_glass_widgets: ^0.29.5

  # iOS 26 uzerinde yerel UIKit cam bilesenleri.
  # Yalnizca iOS 26+ cihazlarda devreye giriyor, digerlerinde
  # yukaridaki shader tabanli uygulamaya dusuyor.
  native_liquid_glass: ^0.2.7

  # ZORUNLU: cam widgetlar (arama cubugu temizleme ikonu, menuler)
  # CupertinoIcons kullaniyor. Bu paket olmadan o ikonlar bos
  # kutu olarak ciziliyor.
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
