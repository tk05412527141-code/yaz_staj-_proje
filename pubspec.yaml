name: deprem_takip
description: "Türkiye ve çevresindeki son depremleri AFAD ve Kandilli verileriyle gösteren mobil uygulama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP istekleri (API'den veri cekmek icin)
  http: ^1.5.0

  # Harita - OpenStreetMap kullanir, API anahtari GEREKTIRMEZ
  flutter_map: ^8.3.0

  # Enlem/boylam veri tipi (flutter_map ile birlikte kullanilir)
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
